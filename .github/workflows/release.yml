name: Release

# Publishes to npm when a version tag (v1.2.3, v1.0.0-alpha.1) is pushed. No npm token: trusted
# publishing (OIDC) with provenance, so anyone can check the package was built here, from this tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache when publishing
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - name: Publish (pre-releases under their own dist-tag, never latest)
        run: |
          TAG=$(node -p "(require('./package.json').version.split('-')[1] ?? 'latest').split('.')[0]")
          npm publish --provenance --access public --tag "$TAG"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
